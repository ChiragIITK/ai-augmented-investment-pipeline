[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-augmented-investment-pipeline"
version = "0.1.0"
description = "AI-augmented investment pipeline for startup sourcing and analysis"
requires-python = ">=3.12"

[project.scripts]
pipeline = "investment_pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 88